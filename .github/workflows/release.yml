name: Release (reference-fix fork)

# Fork of argon-rbx/argon 2.0.29 with the reference round-trip fix (imported model Ref properties such as
# PrimaryPart and weld Part0/Part1 keep their targets; dangling references fail validation).
# Push a tag like 2.0.29-ref.1: every target runs the reference tests, builds, and uploads
# argon-<tag>-<label>.zip in the same naming as upstream, so Rokit can install it.

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Argon 2.0.29 with the reference round-trip fix (imported model Ref properties keep their targets; dangling references fail validation). Base: argon-rbx/argon 2.0.29 (3dbed6de). Install with Rokit: rokit add ${{ github.repository }}@${{ github.ref_name }} argon"

  build:
    name: Build (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { host: windows, os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x86_64 }
          - { host: linux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, label: linux-x86_64 }
          - { host: macos, os: macos-15-intel, target: x86_64-apple-darwin, label: macos-x86_64 }
          - { host: macos, os: macos-latest, target: aarch64-apple-darwin, label: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Reference tests
        run: cargo test --locked --test reference_roundtrip --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --all-features --release --target ${{ matrix.target }}

      - name: Archive
        shell: bash
        run: |
          mkdir release
          if [ "${{ matrix.host }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/argon.exe" release/
            cd release && 7z a ../release.zip *
          else
            cp "target/${{ matrix.target }}/release/argon" release/
            cd release && zip ../release.zip *
          fi

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release.zip "argon-${{ github.ref_name }}-${{ matrix.label }}.zip"
          gh release upload "${{ github.ref_name }}" "argon-${{ github.ref_name }}-${{ matrix.label }}.zip" -R "${{ github.repository }}"
